name: Deploy Control Center to Pages

# Publishes control-center/ to GitHub Pages. Runs whenever the dashboard or its
# data changes (the daily refresh job commits new data/*.json), or manually.
on:
  push:
    branches: [main, claude/alert-system-client-dashboard-9bhk8]
    paths:
      - "control-center/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload control-center as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: control-center

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
