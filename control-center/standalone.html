      padding: 6px 12px; font-size: 12px; cursor: pointer; user-select: none; }

","detectedAt":"2026-05-31","id":"a-park-place-underpacing","clientId":"park-place","client":"Park Place","platform":"—","account":"budget","category":"spend_budget","severity":"info","title":"Underpacing budget","detail":"Last-30d spend is only 0% of the monthly budget. ZAR 0 / ZAR 5,000 (0%). Budget may be under-delivering.","metric":"ZAR 0 / ZAR 5,000 (0%)","action":"Check delivery / approvals; reallocate or raise bids if intentional headroom."},{"source":"live","cadence":"weekly","detectedAt":"2026-05-31","id":"a-rms-underpacing","clientId":"rms","client":"Rola Motor Group (RMS)","platform":"—","account":"budget","category":"spend_budget","severity":"info","title":"Underpacing budget","detail":"Last-30d spend is only 52% of the monthly budget. ZAR 35,083.68 / ZAR 67,500 (52%). Budget may be under-delivering.","metric":"ZAR 35,083.68 / ZAR 67,500 (52%)","action":"Check delivery / approvals; reallocate or raise bids if intentional headroom."},{"id":"w-rolatoyota-brand-budgetcap","clientId":"rola-toyota","client":"Rola Toyota","platform":"google","account":"3055032494","category":"spend_budget","severity":"info","source":"live","cadence":"weekly","title":"Budget-constrained (scaling opportunity)","detail":"'Search - Brand (R6000)' runs at ~R247/day vs a R250 cap (99%) at a strong R50 CPA (148 conversions) — likely leaving converting traffic on the table.","metric":"~99% budget utilisation · R50 CPA","action":"Consider raising the daily budget.","detectedAt":"2026-05-31"},{"id":"w-rolatoyota-newveh-budgetcap","clientId":"rola-toyota","client":"Rola Toyota","platform":"google","account":"3055032494","category":"spend_budget","severity":"info","source":"live","cadence":"weekly","title":"Budget-constrained at higher CPA","detail":"'Search - New Vehicles (R9000)' runs at ~R235/day vs a R236 cap (99%) but at R261 CPA (27 conversions). Capped, but weaker efficiency than Brand.","metric":"~99% budget utilisation · R261 CPA","action":"Improve efficiency before scaling.","de <body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SEV_ORDER = { critical: 0, warning: 1, info: 2 };
    const CAT_LABELS = {
      account_health: "Account health", spend_budget: "Spend & budget",
      performance: "Performance", data_freshness: "Data freshness"
    };
    const fmt = (n) => n == null ? "—" : n.toLocaleString(undefined, { maximumFractionDigits: 0 });
    const money = (n, c) => n == null ? "—" : `${c === "USD" ? "$" : c === "GBP" ? "£" : "R"}${n.toLocaleString(undefined,{maximumFractionDigits:0})}`;

    function healthFor(client, alerts) {
      const mine = alerts.filter(a => a.clientId === client.id);
      const hasErr = client.platforms.some(p => p.status === "error");
      if (hasErr || mine.some(a => a.severity === "critical")) return "crit";
      if (mine.some(a => a.severity === "warning")) return "warn";
      if (client.platforms.every(p => p.status === "pending")) return "pending";
      return "ok";
    }

    function KPI({ label, val, sub, children }) {
      return (
        <div className="kpi">
          <div className="label">{label}</div>
          <div className="val">{val}</div>
          {sub && <div className="sub">{sub}</div>}
          {children}
        </div>
      );
    }

    function AlertCard({ a }) {
      return (
        <div className={"alert " + a.severity.slice(0,4)}>
          <div className="a-head">
            <div>
              <div className="a-title">{a.title}</div>
              <div className="a-client">{a.client} · {a.platform === "meta" ? "Meta" : "Google Ads"} · <span className="cat-tag">{CAT_LABELS[a.category]}</span></div>
            </div>
            <span className={"badge " + (a.source === "live" ? "live" : "sample")}>{a.source}</span>
          </div>
          <div className="a-detail">{a.detail}</div>
          {a.metric && <span className="a-metric">{a.metric}</span>}
          {a.action && <div className="a-action"><b>Action:</b> {a.action}</div>}
        </div>
      );
    }

    function Pace({ budget, range }) {
      if (!budget) return null;
      const p = (budget.pacingByRange && budget.pacingByRange[range]) || budget.pacing;
      const denom = range === "last_7d" && p && p.target != null ? p.target : budget.monthly;
      if (!p || !p.hasLive) {
        return (
          <div className="pace">
            <div className="pace-top"><span>budget</span><b>{money(budget.monthly, budget.currency)}</b></div>
            <div className="pacebar"></div>
          </div>
        );
      }
      const pct = p.pct;
      const cls = pct >= 110 ? "over" : pct < 60 ? "under" : "ok";
      return (
        <div className={"pace " + cls} title={range === "last_7d" ? "Last-7d spend vs pro-rata weekly target" : "Month-to-date spend vs monthly budget"}>
          <div className="pace-top"><span>{pct}%</span><b>{money(p.spend, budget.currency)}/{money(denom, budget.currency)}</b></div>
          <div className="pacebar"><i style={{ width: Math.min(100, pct) + "%" }}></i></div>
        </div>
      );
    }

    function ClientRow({ client, alerts, onClick, range }) {
      const h = healthFor(client, alerts);
      const colors = { crit: "var(--crit)", warn: "var(--warn)", ok: "var(--ok)", pending: "var(--muted)" };
      const mine = alerts.filter(a => a.clientId === client.id);
      const crit = mine.filter(a => a.severity === "critical").length;
      const warn = mine.filter(a => a.severity === "warning").length;
      return (
        <div className="client" onClick={onClick}>
          <div className="c-left">
            <span className="hdot" style={{ background: colors[h] }}></span>
            <div style={{minWidth:0}}>
              <div className="c-name">{client.name} {client.category && <span className={"cat-badge " + client.category}>{client.category}</span>}</div>
              <div className="c-meta">{client.region} · {client.currency}</div>
            </div>
          </div>
          <div className="c-right">
            <Pace budget={client.budget} range={range} />
            <div className="chips">
              {client.platforms.map((p,i) => (
                <span key={i} className={"chip " + p.platform + (p.status === "error" ? " err" : "")}>
                  {p.platform === "meta" ? "Meta" : "Google"}{p.status === "error" ? "!" : ""}
                </span>
              ))}
            </div>
            <div className="alertcount">
              {crit > 0 && <b className="crit">{crit}●</b>} {warn > 0 && <b className="warn">{warn}●</b>}
              {crit === 0 && warn === 0 && <span>—</span>}
            </div>
          </div>
        </div>
      );
    }

    function Drawer({ client, alerts, onClose, range }) {
      const mine = alerts.filter(a => a.clientId === client.id).sort((x,y)=>SEV_ORDER[x.severity]-SEV_ORDER[y.severity]);
      return (
        <div className="drawer-bg" onClick={onClose}>
          <div className="drawer" onClick={e => e.stopPropagation()}>
            <span className="x" onClick={onClose}>×</span>
            <h3>{client.name} {client.category && <span className={"cat-badge " + client.category}>{client.category}</span>}</h3>
            <div className="sub">{client.group} · {client.region} · {client.currency}</div>

            {client.budget && (
              <div className="budgetbox">
                <div className="bb-top">
                  <div style={{color:"var(--muted)", fontSize:12, textTransform:"uppercase", letterSpacing:".5px"}}>Monthly budget</div>
                  <div className="bb-total">{money(client.budget.monthly, client.budget.currency)}</div>
                </div>
                {client.budget.pacingByRange && client.budget.pacingByRange[range] && client.budget.pacingByRange[range].hasLive
                  ? <div style={{marginTop:10}}><Pace budget={client.budget} range={range} /></div>
                  : <div className="a-detail" style={{marginTop:8, color:"var(--muted)"}}>Pacing appears once live spend is linked to this account.</div>}
                {client.budget.lines.map((l, i) => (
                  <div className="budgetline" key={i}>
                    <div>{l.name} <span className="bl-meta">· {l.channel}{l.level === "campaign" ? " · campaign" : ""}</span></div>
                    <div>{money(l.amount, client.budget.currency)}</div>
                  </div>
                ))}
              </div>
            )}

            <h2 style={{fontSize:13, color:"var(--muted)", textTransform:"uppercase", letterSpacing:".6px"}}>Accounts</h2>
            {client.platforms.map((p, i) => {
              const m = p.metricsByRange ? p.metricsByRange[range] : null;
              return (
              <div className="acct" key={i}>
                <div className="a-top">
                  <div><span className={"chip " + p.platform}>{p.platform === "meta" ? "Meta" : "Google Ads"}</span> <span className="mono">{p.accountId}</span></div>
                  <span className={"statusbadge " + p.status}>{p.status}</span>
                </div>
                {p.error && <div className="a-detail" style={{color:"#ffb3ba", marginTop:8}}>{p.error}</div>}
                {m ? (
                  <div className="metrics">
                    {m.spend != null && <div className="m"><div className="mk">Spend</div><div className="mv">{money(m.spend, m.currency)}</div></div>}
                    {m.leads != null && <div className="m"><div className="mk">Leads</div><div className="mv">{fmt(m.leads)}</div></div>}
                    {m.purchases != null && <div className="m"><div className="mk">Purchases</div><div className="mv">{fmt(m.purchases)}</div></div>}
                    {m.conversions != null && <div className="m"><div className="mk">Conv</div><div className="mv">{fmt(m.conversions)}</div></div>}
                    {m.cpa != null && <div className="m"><div className="mk">CPA</div><div className="mv">{money(m.cpa, m.currency)}</div></div>}
                    {m.roas != null && <div className="m"><div className="mk">ROAS</div><div className="mv">{m.roas}×</div></div>}
                    {m.ctr != null && <div className="m"><div className="mk">CTR</div><div className="mv">{m.ctr}%</div></div>}
                    {m.clicks != null && <div className="m"><div className="mk">Clicks</div><div className="mv">{fmt(m.clicks)}</div></div>}
                  </div>
                ) : (
                  <div className="a-detail" style={{marginTop:8, color:"var(--muted)"}}>
                    {p.status === "pending" ? "Awaiting account link / next refresh." : "No spend in this date range."}
                  </div>
                )}
              </div>
            );})}

            <h2 style={{fontSize:13, color:"var(--muted)", textTransform:"uppercase", letterSpacing:".6px", marginTop:20}}>Alerts ({mine.length})</h2>
            {mine.length ? mine.map(a => <AlertCard key={a.id} a={a} />) : <div className="empty">No active alerts for this client.</div>}
          </div>
        </div>
      );
    }

    function App() {
      const [snapshot, setSnapshot] = useState(null);
      const [clients, setClients] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [err, setErr] = useState(null);
      const [q, setQ] = useState("");
      const [sev, setSev] = useState("all");
      const [cat, setCat] = useState("all");
      const [sel, setSel] = useState(null);
      const [range, setRange] = useState("mtd");

      useEffect(() => {
        // Standalone build: data is embedded on window.__CC_DATA__ so the file works offline.
        if (window.__CC_DATA__) {
          const d = window.__CC_DATA__;
          setSnapshot(d.snapshot); setClients(d.clients.clients); setAlerts(d.alerts.alerts);
          return;
        }
        Promise.all([
          fetch("data/snapshot.json").then(r => r.json()),
          fetch("data/clients.json").then(r => r.json()),
          fetch("data/alerts.json").then(r => r.json()),
        ]).then(([s, c, a]) => { setSnapshot(s); setClients(c.clients); setAlerts(a.alerts); })
          .catch(e => setErr(e.message));
      }, []);

      const visibleAlerts = useMemo(() => alerts
        .filter(a => sev === "all" || a.severity === sev)
        .filter(a => cat === "all" || a.category === cat)
        .sort((x,y)=>SEV_ORDER[x.severity]-SEV_ORDER[y.severity]), [alerts, sev, cat]);

      const groups = useMemo(() => {
        const filtered = clients.filter(c => c.name.toLowerCase().includes(q.toLowerCase()) || c.group.toLowerCase().includes(q.toLowerCase()));
        const map = {};
        filtered.forEach(c => { (map[c.group] = map[c.group] || []).push(c); });
        return map;
      }, [clients, q]);

      if (err) return <div className="wrap"><div className="loaderr">
        Could not load data files: <b>{err}</b>.<br/>This dashboard reads <code>data/*.json</code> over HTTP. Open it via a server
        (<code>npx serve</code> or GitHub Pages), not as a <code>file://</code> path.</div></div>;
      if (!snapshot) return <div className="wrap"><div className="empty">Loading control center…</div></div>;

      const ac = snapshot.alertCounts;
      const ranges = snapshot.ranges || [{ id: "mtd", label: "Month-to-date" }];
      const rangeLabel = (ranges.find(r => r.id === range) || ranges[0]).label;
      const liveSpend = (snapshot.liveSpendByRange && snapshot.liveSpendByRange[range]) || snapshot.liveSpend;
      return (
        <div className="wrap">
          <header className="top">
            <div className="brand">
              <h1>Client Control Center</h1>
              <p>{snapshot.agency} · Google Ads + Meta via Campaign Forge</p>
            </div>
            <div style={{display:"flex", flexDirection:"column", alignItems:"flex-end", gap:8}}>
              <div className="rangesel">
                {ranges.map(r => (
                  <button key={r.id} className={range === r.id ? "active" : ""} onClick={() => setRange(r.id)}>{r.label}</button>
                ))}
              </div>
              <div className="refresh">
                Last refresh <b>{new Date(snapshot.lastRefresh).toLocaleString()}</b> · Showing <b>{rangeLabel}</b>
              </div>
            </div>
          </header>

          <div className="kpis">
            <KPI label="Clients" val={snapshot.totals.clients} sub={`${snapshot.totals.adAccounts} ad accounts`} />
            <KPI label="Live accounts" val={snapshot.totals.accountsLive}
              sub={`${snapshot.totals.accountsPending} pending · ${snapshot.totals.accountsError} error`} />
            {liveSpend.map((s,i) => (
              <KPI key={i} label={`Live spend · ${s.currency}`} val={money(s.spend, s.currency)} sub={rangeLabel} />
            ))}
            {snapshot.monthlyBudget && snapshot.monthlyBudget.length > 0 && (
              <KPI label="Monthly budget" val={money(snapshot.monthlyBudget[0].amount, snapshot.monthlyBudget[0].currency)}
                sub={snapshot.monthlyBudget.length > 1 ? "+ " + snapshot.monthlyBudget.slice(1).map(b => money(b.amount, b.currency)).join(" · ") : "across all clients"} />
            )}
            <KPI label="Active alerts" val={ac.total}>
              <div className="sev-dots">
                <span><i className="dot crit"></i>{ac.critical} crit</span>
                <span><i className="dot warn"></i>{ac.warning} warn</span>
                <span><i className="dot info"></i>{ac.info} info</span>
              </div>
            </KPI>
          </div>

          <div className="layout">
            <div className="panel">
              <h2>Alert Center <span className="count">· {visibleAlerts.length} shown</span></h2>
              <div className="filters">
                {["all","critical","warning","info"].map(s => (
                  <span key={s} className={"pill " + (sev===s?"active":"")} onClick={()=>setSev(s)}>{s}</span>
                ))}
              </div>
              <div className="filters">
                {["all","account_health","spend_budget","performance","data_freshness"].map(c => (
                  <span key={c} className={"pill " + (cat===c?"active":"")} onClick={()=>setCat(c)}>{c==="all"?"all categories":CAT_LABELS[c]}</span>
                ))}
              </div>
              {visibleAlerts.length ? visibleAlerts.map(a => <AlertCard key={a.id} a={a} />) : <div className="empty">No alerts match these filters.</div>}
            </div>

            <div className="panel">
              <h2>Clients <span className="count">· {clients.length} accounts roster</span></h2>
              <div className="filters">
                <input type="text" placeholder="Search clients or groups…" value={q} onChange={e=>setQ(e.target.value)} />
              </div>
              {Object.keys(groups).length ? Object.entries(groups).map(([g, list]) => (
                <div className="group" key={g}>
                  <div className="g-name">{g} · {list.length}</div>
                  {list.map(c => <ClientRow key={c.id} client={c} alerts={alerts} range={range} onClick={()=>setSel(c)} />)}
                </div>
              )) : <div className="empty">No clients match.</div>}
            </div>
          </div>

          <div className="foot">
            Source: {snapshot.source} · Refreshed daily by the <code>client-control-center-refresh</code> scheduled session.<br/>
            <span className="badge live">live</span> = pulled from the API this run · <span className="badge sample">sample</span> = rule placeholder shown until enough history accrues.
          </div>

          {sel && <Drawer client={sel} alerts={alerts} range={range} onClose={()=>setSel(null)} />}
        </div>
      );
    }

    // Lightweight access gate. Client-side only — a deterrent for an internal
    // link, NOT real authentication (see README). Password is obfuscated, not secure.
    const GATE_KEY = "MTJjYW1wYWlnbmZvcmdlMzQ=";
    function AuthGate({ children }) {
      const [ok, setOk] = useState(() => sessionStorage.getItem("cc_auth") === "1");
      const [val, setVal] = useState("");
      const [err, setErr] = useState("");
      if (ok) return children;
      const submit = (e) => {
        e.preventDefault();
        if (btoa(val) === GATE_KEY) { sessionStorage.setItem("cc_auth", "1"); setOk(true); }
        else setErr("Incorrect password.");
      };
      return (
        <div className="gate">
          <form className="box" onSubmit={submit}>
            <h2>Client Control Center</h2>
            <p>ROI Solutions · internal access</p>
            <input type="password" autoFocus placeholder="Password" value={val}
              onChange={e => { setVal(e.target.value); setErr(""); }} />
            <button type="submit">View dashboard</button>
            <div className="err">{err}</div>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate><App /></AuthGate>);
  </script>
</body>
</html>
